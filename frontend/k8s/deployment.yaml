apiVersion: apps/v1
kind: Deployment
metadata:
  name: mikil-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mikil-frontend
  template:
    metadata:
      labels:
        app: mikil-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"